title: "From Recording to Record: Distilling Public Meetings into Typed and Linked Data"
subtitle: "Version 0.1.0 · GovCenter, a Civic Studio research project"
authors:
  - name: Ryan Wold
    affiliation: Civic Studio
    email: ryan@civic.studio
date: "November 2, 2026"
abstract: |
  Local governments decide in public, and almost all of the context for those decisions is on the record: hours of meeting video, agendas without times, roll calls, staff reports and minutes. That context is rarely connected. Projects, budgets, programs, departments and expenditures are discussed again and again across months of meetings, and nothing links one mention to the next. We describe a method that treats a meeting and its supporting materials as data in three forms. The raw form is what the city publishes, kept as published. The typed form is a set of records, each anchored to a second of the recording and carrying its source, confidence and review status. The linked form gives the real-world things a meeting refers to an identity that holds across meetings and years. Machines do most of the work of moving between forms, and a person confirms what will be shown publicly. Applied to seven meetings of one municipal commission (about 130,000 words in session), the method placed 163 of 168 agenda items on the recording from speech alone and threaded a park project across all seven meetings. We argue that this work pays a coordination cost once and keeps the resulting context visible, which should make public decisions better informed.
